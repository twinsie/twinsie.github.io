        function loadFileData(filename) {

                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });

                var filteredData = jsonData.filter(row => row.some(filledCell));

"Cayman Islands": { greenCard: "Yes", schengen: "No", chinesePassport: "No", notes: ""},
"Bermuda": { greenCard: "Yes", schengen: "No", chinesePassport: "No", notes: ""},
"Turks and Caicos": { greenCard: "Yes", schengen: "No", chinesePassport: "No", notes: ""},
"Tuvalu": { greenCard: "No", schengen: "No", chinesePassport: "Yes", notes: "Visa on Arrival"},
"Palau": { greenCard: "No", schengen: "No", chinesePassport: "Yes", notes: "Visa on Arrival"},
"Solomon Islands": { greenCard: "No", schengen: "No", chinesePassport: "Yes", notes: "Visa on Arrival"}



            // Add more countries as needed
        };

        // Country name mapping for GeoJSON discrepancies
        const countryNameMap = {
            "United States of America": "United States",
            "United Kingdom": "UK",
            // Add more mappings as needed
        };

        // Reference to the GeoJSON layer for updating
        let geoJsonLayer;

        // Function to update map based on checkbox states
        function updateMap() {
            // Get checkbox states
            const showChinesePassport = document.getElementById('chinesePassport').checked;
            const showSchengen = document.getElementById('schengen').checked;
            const showGreenCard = document.getElementById('greenCard').checked;

            // Remove existing GeoJSON layer if it exists
            if (geoJsonLayer) {
                map.removeLayer(geoJsonLayer);
            }

            // Load GeoJSON data
            fetch('https://raw.githubusercontent.com/datasets/geo-boundaries-world-110m/master/countries.geojson')
                .then(response => response.json())
                .then(data => {
                    geoJsonLayer = L.geoJSON(data, {
                        style: function(feature) {
                            let countryName = feature.properties.name;
                            countryName = countryNameMap[countryName] || countryName;

                            // Default to grey
                            const countryData = visaData[countryName];
                            let isVisaFree = false;

                            if (countryData) {
                                isVisaFree = (showGreenCard && countryData.greenCard === "Yes") ||
                                             (showSchengen && countryData.schengen === "Yes") ||
                                             (showChinesePassport && countryData.chinesePassport === "Yes");
                            }

                            // Log unmatched countries for debugging
                            if (!countryData) {
                                console.log(`No visa data for: ${countryName}`);
                            }

                            return {
                                fillColor: isVisaFree ? '#00ff00' : '#808080',
                                weight: 1,
                                opacity: 1,
                                color: 'white',
                                fillOpacity: 0.7
                            };
                        },
                        onEachFeature: function(feature, layer) {
                            let countryName = feature.properties.name;
                            countryName = countryNameMap[countryName] || countryName;

                            const countryData = visaData[countryName] || {
                                greenCard: "No",
                                schengen: "No",
                                chinesePassport: "No",
                                notes: "No visa-free access with US Green Card, Schengen visa, or Chinese passport."
                            };

                            // Create tooltip content
                            const tooltipContent = `
                                <strong>${countryName}</strong><br>
                                Visa-Free with US Green Card: ${countryData.greenCard}<br>
                                Visa-Free with Schengen Visa: ${countryData.schengen}<br>
                                Visa-Free with Chinese Passport: ${countryData.chinesePassport}<br>
                                Notes: ${countryData.notes}
                            `;

                            // Bind tooltip to layer
                            layer.bindTooltip(tooltipContent, {
                                sticky: true,
                                className: 'leaflet-tooltip'
                            });

                            // Highlight country on hover
                            layer.on({
                                mouseover: function(e) {
                                    e.target.setStyle({
                                        fillColor: '#ffdd00',
                                        fillOpacity: 0.9
                                    });
                                },
                                mouseout: function(e) {
                                    let countryName = feature.properties.name;
                                    countryName = countryNameMap[countryName] || countryName;
                                    const countryData = visaData[countryName];
                                    let isVisaFree = false;

                                    if (countryData) {
                                        isVisaFree = (showGreenCard && countryData.greenCard === "Yes") ||
                                                     (showSchengen && countryData.schengen === "Yes") ||
                                                     (showChinesePassport && countryData.chinesePassport === "Yes");
                                    }

                                    e.target.setStyle({
                                        fillColor: isVisaFree ? '#00ff00' : '#808080',
                                        fillOpacity: 0.7
                                    });
                                }
                            });
                        }
                    }).addTo(map);
                })
                .catch(error => console.error('Error loading GeoJSON:', error));
        }

        // Initial map render
        updateMap();

        // Add event listeners to checkboxes
        document.getElementById('chinesePassport').addEventListener('change', updateMap);
        document.getElementById('schengen').addEventListener('change', updateMap);
        document.getElementById('greenCard').addEventListener('change', updateMap);
    </script>
</body>
