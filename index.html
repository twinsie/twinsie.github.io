<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
	<meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="tripsdata.js"></script>
	<link rel="stylesheet" href="tripsdata.css">
	<link rel="icon" type="image/x-icon" href="images/icon/favicon3.png">
	<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Long+Cang&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Long+Cang&family=Noto+Serif+SC:wght@200..900&display=swap" rel="stylesheet">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Quintessential&display=swap" rel="stylesheet">
    <title>罗家的旅行</title>
    <style>
        body {
            font-family: 'Noto Serif SC', serif;
            text-align: center;
            padding: 20px;
            /*background-color: #f4f4f4;*/
			margin: 0;
            background-color: #f2f2f2; /* Solid background when image disappears */
            position: relative;
            opacity: 1; /* Ensure content is fully opaque */
            z-index: 0;
        }
		/* Default background (gradient animation) */
        body.bg-default {
            background: linear-gradient(45deg, #f2f2f2, #cccccc, #f2f2f2, #cccccc, #f2f2f2, #cccccc, #f2f2f2, #cccccc);
            background-size: 400%;
            animation: gradientShift 15s ease infinite;
        }
		/* Background image layer (scrolls with page, transparent) */
        .background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 500px; /* Covers header; adjust if needed */
            background-size: cover;
            background-position: center;
            opacity: 0.6; /* Transparent/muted background image */
            z-index: -2;
            transition: background-image 500ms ease-in-out;
        }        
        /* Fade-out gradient at bottom of background layer */
        .fade-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 500px; /* Matches background-layer */
            background-image: linear-gradient(
                to bottom,
                rgba(242, 242, 242, 0) 0%,
                rgba(242, 242, 242, 0.5) 50%,
                rgba(242, 242, 242, 1) 100%
            );
            z-index: -1;
        }
		h1 {
            font-family: 'Long Cang', cursive;
            font-weight: 700;
            color: #7E102C;
            font-size: 3.5em;
			opacity: 1;
            position: sticky;
            top: 0;
            z-index: 100;
			transition: font-size 0.3s ease;
        }
		h1.shrunk {
			font-size: 2.0em;
			background: rgba(242, 242, 242, 0.8);
		}
		@media (max-width: 600px) {
            h1 {
                font-size: 3em;
            }
            h1.shrunk {
                font-size: 1.2em;
            }
            .background-layer,
            .fade-layer {
                height: 250px;
                top: 0;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            h1 {
                transition: none;
            }
            body.bg-default {
                animation: none;
            }
        }
        h2{
            font-family: 'Ma Shan Zheng', serif;
            font-weight: 400;
            color: #58423F;
        }
        h3 {
            font-family: 'Noto Serif SC', serif;
            font-weight: 700;
            color: #58423F;
            font-size: 1.0em;
        }
        h2#trip-subtitle {
            font-size: 1.5em;
            font-weight: 400;
            margin: 15px 0 20px;
        }
		.trip-selector-container {
            position: relative;
            margin: 20px auto;
            max-width: 1200px;
            opacity: 1;
            z-index: 1;
        }
        .trip-selector {
            display: flex;
            flex-wrap: nowrap !important;
            overflow-x: auto !important;
            scroll-behavior: smooth;
            padding: 0 35px;
            -webkit-overflow-scrolling: touch;
            white-space: nowrap;
            justify-content: center;
            gap: 10px;
            width: auto;
            opacity: 1;
            position: relative;
            z-index: 1;
            -ms-overflow-style: none;
            scrollbar-width: none;
            box-sizing: content-box;
        }
		/* Styles for the fading effect */
        .trip-selector::-webkit-scrollbar {
            display: none;
        }
        .fade-left, .fade-right {
            position: absolute;
            top: 0;
            width: 85px;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: none;
        }
        .fade-left.visible, .fade-right.visible {
            display: block;
        }
        .fade-left {
            left: 0;
        }
        .fade-right {
            right: 0;
        }
        .scroll-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(94, 62, 59, 0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            cursor: pointer;
            font-size: 18px;
            z-index: 3;
            opacity: 0.7;
            transition: opacity 0.3s ease, transform 0.2s ease;
            display: none;
            font-family: 'Montserrat', sans-serif;
        }
        .scroll-btn:hover {
            opacity: 1;
            transform: translateY(-50%) scale(1.1);
        }
        .scroll-btn:focus {
            outline: 2px solid #7E102C;
            outline-offset: 2px;
        }
        .scroll-btn.visible {
            display: block;
        }
        .scroll-btn.left-btn {
            left: 0;
        }
        .scroll-btn.right-btn {
            right: 0;
        }
        @media (max-width: 600px) {
            .background-layer,
            .fade-layer {
                height: 250px;
            }
            .trip-selector {
                padding: 0 25px;
            }
            .fade-left, .fade-right {
                width: 25px;
            }
            .scroll-btn {
                width: 25px;
                height: 25px;
                font-size: 14px;
            }
        }
        .trip-btn {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: white;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            min-width: 90px;
            flex-shrink: 0;
            opacity: 0;            
            animation: fadeIn 0.5s ease-out forwards;
        }
        .trip-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3); /* Semi-transparent overlay for text readability */
            z-index: 1;
        }
        .trip-btn span {
            position: relative;
            z-index: 2; /* Text above overlay */
        }
        .trip-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .trip-btn.active {
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.7);
            transform: scale(1.1);
        }
		@media (max-width: 600px) {
            .trip-btn {
                min-width: 100px;
                padding: 12px 20px;
                font-size: 14px;
            }
			.modal-content h2 {
                margin-bottom: 5px;
            }
            .modal-content .location {
				margin-top: 2px;
                margin-bottom: 8px;
            }
            .modal-content .description {
                margin-top: 2px;
				margin-bottom: 10px;
            }
			.slide-indicator {
                font-size: 12px;
                margin-top: 8px;
            }
			.background-layer,
            .fade-layer {
                height: 400px; /* Adjust for smaller screens */
            }
        }
        .timeline {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            max-width: 1200px;
            margin: auto;
        }
        .timeline::before {
            content: "";
            position: absolute;
            width: 4px;
            background-color: #7E102C;
            top: 0;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 0;
        }
        .year-block {
            margin: -360px 0 20px;
            width: 45%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .year-block:first-child {
            margin-top: 20px;
        }
        .year-block:nth-child(even) {
            align-items: flex-start;
            margin-left: 50%;
        }
        .year-block:nth-child(odd) {
            margin-right: 50%;
        }
        .year-block::before {
            content: "";
            position: absolute;
            height: 2px;
            background-color: #333;
            top: 45px;
            z-index: 1;
        }
        .year-block:nth-child(odd)::before {
            right: 0;
            left: 100%;
        }
        .year-block:nth-child(even)::before {
            left: 0;
            right: 100%;
        }
        .year-title {
			font-family: 'Quintessential', serif;
			font-weight: 400;
			font-style: italic;
            font-size: 20px;
			color: #58423F;
            background: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            position: sticky; /*relative*/
			top: 40px; /* Adjust based on your header height */
			z-index: 3; /* Ensure it stays above other elements */
            margin-bottom: 10px;
			box-shadow: 0 0 8px rgba(179, 179, 179, 0.7); /* Glow effect matching timeline color */
        }
		.the-end {
            font-family: 'Quintessential', serif;
            font-weight: 400;
            font-style: italic;
            font-size: 24px;
            color: #58423F;
            background: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            position: relative;
            z-index: 2;
            margin: 20px auto;
            text-align: center;
        }
        .event {
            margin: 10px 0;
            padding: 10px;
            max-width: 400px;
            max-height: 500px;
            position: relative;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: left;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .event.show {
            opacity: 1;
            transform: translateY(0);
        }
		.event h3 {
            margin: 0;
            flex-shrink: 0;
        }
        .event img {
            width: 100%;
            height: auto;
            max-width: 380px;
            max-height: 400px;
            margin-top: 10px;
            object-fit: contain;
            flex-shrink: 1;
			cursor: pointer;
        }
        .event p {
            margin: 5px 0 0;
            flex-shrink: 0;
			font-weight: 400;
            color: #58423F;
			font-style: italic;
			font-size: 0.8em;
        }
        .event a {
            text-decoration: none;
			color: #58423F;
            flex-shrink: 0;
            margin-top: 5px;
            cursor: pointer;
			font-weight: bold;
        }
		.event a:hover {
            color: #7E102C;
        }
        #content {
            display: none;
        }
        #access-denied {
            display: none;
            color: #7E102C;
            font-size: 18px;
        }
        .modal {
			display: flex;
            visibility: hidden;
			opacity: 0;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
			transition: opacity 300ms ease-in-out, visibility 300ms ease-in-out;
		/*	backdrop-filter: blur(5px);
			-webkit-backdrop-filter: blur(5px); */
        }
		.modal.modal-open {
			visibility: visible;
			opacity: 1;
		}
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 80vw;
            max-width: 900px;
            height: 80vh;
            max-height: 700px;
            overflow-y: auto;
            position: relative;
            text-align: left;
            display: flex;
            flex-direction: column;
			opacity: 0;
			transform: scale(0.95);
			transition: opacity 300ms ease-in-out, transform 300ms ease-in-out;
        }
		.modal.modal-open .modal-content {
			opacity: 1;
			transform: scale(1);
		}
        .modal-content h2 {
            margin: 0 0 10px;
        }
        .modal-content .location {
            font-style: italic;
            color: #E1D4C1;
            margin-bottom: 15px;
            font-weight: 400;
        }
        .modal-content .description {
            margin-bottom: 20px;
            line-height: 1.6;
			font-weight: 400;
            color: #58423F;
        }
        .slideshow {
            position: relative;
            width: 100%;
            height: 50vh;
            max-height: 500px;
            overflow: hidden;
            border-radius: 4px;
            flex-grow: 1;
			touch-action: pan-y;
        }
        .slideshow img,
        .slideshow video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            z-index: 1;
        }
        .slideshow img.active,
        .slideshow video.active {
            opacity: 1;
            z-index: 2;
        }
        .slideshow video {
            background: #000;
        }
        .slideshow-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            font-size: 18px;
            z-index: 3;
            opacity: 0.7;
            transition: opacity 0.3s ease;
			font-family: 'Montserrat', sans-serif;
        }
        .slideshow:hover .slideshow-btn {
            opacity: 1;
        }
        .prev-btn {
            left: 10px;
        }
        .next-btn {
            right: 10px;
        }		
		.slideshow-btn:focus {
			outline: 2px solid #7E102C;
			outline-offset: 2px;
		}
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            cursor: pointer;
            background: none;
            border: none;
            color: #58423F;
            z-index: 4;
			font-family: 'Montserrat', sans-serif;
        }
		.slide-indicator {
			font-family: 'Montserrat', sans-serif;
			font-size: 14px;
			color: #58423F;
			text-align: center;
			margin-top: 10px;
			margin-bottom: 0;
		}
		#back-to-top {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #333; 
            color: white;
            border: none;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            cursor: pointer;
            display: none;
            opacity: 0.7;
            transition: opacity 0.3s ease, transform 0.2s ease;
            z-index: 1000;
			font-family: 'Montserrat', sans-serif;
			font-size: 4em;
        }
        #back-to-top:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        #back-to-top.show {
            display: block;
        }
		.typing-cursor {
            display: inline-block;
            font-family: 'Playfair Display', serif;
            font-size: 1.5em;
            color: #58423F;
            animation: blink 0.7s step-end infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
		@keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
	<div class="background-layer bg-nz"></div>
    <div class="fade-layer"></div>
    <h1 id="site-title">罗家的旅行</h1>
    <div class="trip-selector-container">
        <div class="fade-left"></div>
        <button class="scroll-btn left-btn" aria-label="Scroll left">←</button>
        <div class="trip-selector">
            <button id="nz-btn" class="trip-btn active" data-trip="nz"><span>新西兰</span></button>
            <button id="iran-btn" class="trip-btn" data-trip="iran"><span>伊朗</span></button>
            <button id="europe-btn" class="trip-btn" data-trip="europe"><span>Europe</span></button>
            <button id="italy-btn" class="trip-btn" data-trip="italy"><span>Italy</span></button>
            <button id="japan-btn" class="trip-btn" data-trip="japan"><span>Japan</span></button>
            <button id="australia-btn" class="trip-btn" data-trip="australia"><span>Australia</span></button>
            <button id="canada-btn" class="trip-btn" data-trip="canada"><span>Canada</span></button>
            <button id="brazil-btn" class="trip-btn" data-trip="brazil"><span>Brazil</span></button>
            <button id="iceland-btn" class="trip-btn" data-trip="iceland"><span>Iceland</span></button>
            <button id="thailand-btn" class="trip-btn" data-trip="thailand"><span>Thailand</span></button>
        </div>
        <button class="scroll-btn right-btn" aria-label="Scroll right">→</button>
        <div class="fade-right"></div>        
    </div>
	<h2 id="trip-subtitle">新西兰南北岛</h2>
    <div id="content">
        <div class="timeline">
            <!-- Timeline content populated by JS -->
        </div>
    </div>
    <div id="access-denied">Access Denied: Incorrect Password</div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">×</button>
            <h2 id="modal-title"></h2>
            <p id="modal-location" class="location"></p>
            <p id="modal-description" class="description"></p>
            <div class="slideshow">
                <!-- Slides populated by JS -->

            </div>
			<p id="slide-indicator" class="slide-indicator"></p>
            <button class="slideshow-btn prev-btn" onclick="changeSlide(-1)"><</button>
			<button class="slideshow-btn next-btn" onclick="changeSlide(1)">></button>
        </div>
    </div>

	<button id="back-to-top" title="Back to Top">
		↑
	</button>
	
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const enablePassword = false;
            const correctPassword = "123";
            const contentDiv = document.getElementById("content");
            const accessDeniedDiv = document.getElementById("access-denied");
			const backgroundLayer = document.querySelector('.background-layer');
			const tripSelector = document.querySelector('.trip-selector');
            const leftBtn = document.querySelector('.scroll-btn.left-btn');
            const rightBtn = document.querySelector('.scroll-btn.right-btn');
            const siteTitle = document.getElementById('site-title');
            let currentTrip = 'nz';
			
			// Sticky title, year title, and gradient scroll handler
            function handleTitleScroll() {
                const isShrunk = window.scrollY > 0;
                siteTitle.classList.toggle('shrunk', isShrunk);
                document.querySelectorAll('.year-title').forEach(yearTitle => {
                    yearTitle.classList.toggle('shrunk', isShrunk);
                });
                // Apply gradient only when shrunk and no trip is selected
                document.body.classList.toggle('bg-default', isShrunk && !currentTrip);
            }
			
			// Debounce scroll event
            let scrollTimeout;
            window.addEventListener('scroll', () => {
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(handleTitleScroll, 10);
            });
			
			// Initial check
            handleTitleScroll();

            // Scroll arrow and fade functionality
            function updateScrollButtons() {
                const isAtStart = tripSelector.scrollLeft <= 1;
                const isAtEnd = tripSelector.scrollLeft + tripSelector.clientWidth >= tripSelector.scrollWidth - 1;
                const isScrollable = tripSelector.scrollWidth > tripSelector.clientWidth + 2;
                leftBtn.classList.toggle('visible', !isAtStart && isScrollable);
                rightBtn.classList.toggle('visible', !isAtEnd && isScrollable);
                document.querySelector('.fade-left').classList.toggle('visible', !isAtStart && isScrollable);
                document.querySelector('.fade-right').classList.toggle('visible', !isAtEnd && isScrollable);
                tripSelector.style.justifyContent = isScrollable ? 'flex-start' : 'center';
                console.log('isScrollable:', isScrollable, 'scrollWidth:', tripSelector.scrollWidth, 'clientWidth:', tripSelector.clientWidth);
                console.log('Arrow visibility:', leftBtn.classList.contains('visible'), rightBtn.classList.contains('visible'));
                console.log('Fade visibility:', document.querySelector('.fade-left').classList.contains('visible'), document.querySelector('.fade-right').classList.contains('visible'));
                console.log('Justify-content:', tripSelector.style.justifyContent || getComputedStyle(tripSelector).justifyContent);
            }
            
            leftBtn.addEventListener('click', () => {
                tripSelector.scrollBy({ left: -200, behavior: 'smooth' });
                setTimeout(updateScrollButtons, 300);
            });

            rightBtn.addEventListener('click', () => {
                tripSelector.scrollBy({ left: 200, behavior: 'smooth' });
                setTimeout(updateScrollButtons, 300);
            });
            
            tripSelector.addEventListener('scroll', updateScrollButtons);
            window.addEventListener('resize', updateScrollButtons);
            setTimeout(updateScrollButtons, 100); // Initial check after load

            // Keyboard support for arrows
            tripSelector.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    tripSelector.scrollBy({ left: -200, behavior: 'smooth' });
                    setTimeout(updateScrollButtons, 300);
                } else if (e.key === 'ArrowRight') {
                    tripSelector.scrollBy({ left: 200, behavior: 'smooth' });
                    setTimeout(updateScrollButtons, 300);
                }
            });
            
			function typewriterEffect(element, text, speed = 100) {
                element.innerHTML = '';
                let i = 0;
                const type = () => {
                    if (i < text.length) {
                        element.innerHTML = text.slice(0, i + 1) + '<span class="typing-cursor">_</span>';
                        i++;
                        setTimeout(type, speed);
                    } else {
                        element.innerHTML = text + '<span class="typing-cursor">_</span>';
                    }
                };
                type();
            }
			
			
				
            if (enablePassword) {
                const userPassword = prompt("Please enter the password to view this website:");
                if (userPassword === correctPassword) {
                    contentDiv.style.display = "block";
                    loadTimeline('nz');
                } else {
                    accessDeniedDiv.style.display = "block";
					document.body.className = "bg-default";
                    backgroundLayer.style.display = "none";
                    document.querySelector('.fade-layer').style.display = "none";
                }
            } else {
                contentDiv.style.display = "block";
                loadTimeline('nz');
            }

            const tripButtons = document.querySelectorAll('.trip-btn');
            tripButtons.forEach(button => {
                button.addEventListener('click', function() {
                    tripButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    loadTimeline(this.dataset.trip);
                });
            });

            function loadTimeline(trip) {
                const timeline = document.querySelector(".timeline");
                timeline.innerHTML = ""; // Clear existing timeline
				currentTrip = trip;
                const tripData = tripsData[trip];
                typewriterEffect(document.getElementById("trip-subtitle"), tripData.subtitle);
	
				// Update background image
                backgroundLayer.className = `background-layer ${tripData.backgroundImage}`;
                document.body.className = ""; // Clear body classes
				
                const eventsData = tripData.events;
                let yearIndex = 0;
                for (let year in eventsData) {
                    let yearBlock = document.createElement("div");
                    yearBlock.className = "year-block";
                    let yearTitle = document.createElement("div");
                    yearTitle.className = "year-title";
                    yearTitle.textContent = year;
                    yearBlock.appendChild(yearTitle);
                    
                    eventsData[year].forEach((event, index) => {
                        let eventDiv = document.createElement("div");
                        eventDiv.className = "event";
                        eventDiv.innerHTML = `
                            <h3>${event.title}</h3>
                            <img src="${event.image}" alt="${year} Event" loading="lazy" onclick="showModal('${year}', ${index}, '${trip}')">
                            <p>地点: ${event.location}</p>
                            <a onclick="showModal('${year}', ${index}, '${trip}')">更多</a>
                        `;
                        yearBlock.appendChild(eventDiv);
                    });
                    
                    timeline.appendChild(yearBlock);
                    yearIndex++;
                }
				
				let theEnd = document.createElement("div");
				theEnd.className = "the-end";
				theEnd.textContent = "The End";
				timeline.appendChild(theEnd);
				
                window.tripsData = tripsData;

                function checkVisibility() {
                    document.querySelectorAll(".event").forEach(event => {
                        const rect = event.getBoundingClientRect();
                        if (rect.top < window.innerHeight * 0.8) {
                            event.classList.add("show");
                        }
                    });
                }
                window.addEventListener("scroll", checkVisibility);
                checkVisibility();
            }
			
			// Back to Top Button Logic
            const backToTopButton = document.getElementById("back-to-top");
            window.addEventListener("scroll", () => {
                if (window.scrollY > 100) {
                    backToTopButton.classList.add("show");
                } else {
                    backToTopButton.classList.remove("show");
                }
            });

            backToTopButton.addEventListener("click", () => {
                backToTopButton.classList.add("active");
                window.scrollTo({ top: 0, behavior: "smooth" });
                setTimeout(() => {
                    backToTopButton.classList.remove("active");
                }, 200);
            });
			
			backToTopButton.addEventListener("touchend", () => {
                setTimeout(() => {
                    backToTopButton.classList.remove("active");
                    backToTopButton.style.opacity = "0.7";
                }, 300);
            });
        });

        let currentSlide = 0;
        let currentImages = [];
        let currentTrip = 'nz';

		function positionSlideshowButtons() {
            const slideshow = document.querySelector('.slideshow');
            const prevBtn = document.querySelector('.prev-btn');
            const nextBtn = document.querySelector('.next-btn');
            if (slideshow && prevBtn && nextBtn) {
                const slideshowRect = slideshow.getBoundingClientRect();
                const modalContent = document.querySelector('.modal-content');
                const modalRect = modalContent.getBoundingClientRect();
                const slideshowTop = slideshowRect.top - modalRect.top + (slideshowRect.height / 2);
                prevBtn.style.top = `${slideshowTop}px`;
                nextBtn.style.top = `${slideshowTop}px`;
                prevBtn.style.transform = 'translateY(-50%)';
                nextBtn.style.transform = 'translateY(-50%)';
                console.log('Buttons positioned at top:', slideshowTop);
            } else {
                console.error('Slideshow or buttons not found for positioning');
            }
        }
		
        function showModal(year, index, trip) {
            console.log('showModal called:', { year, index, trip });
            try {
			
				const event = window.tripsData[trip].events[year][index];
				const modal = document.getElementById("modal");
				const modalTitle = document.getElementById("modal-title");
				const modalLocation = document.getElementById("modal-location");
				const modalDescription = document.getElementById("modal-description");
				const slideshow = document.querySelector(".slideshow");

				modalTitle.textContent = event.title;
				modalLocation.textContent = `Location: ${event.location}`;
				modalDescription.innerHTML = event.description;
				currentImages = event.images;
				currentSlide = 0;
				currentTrip = trip;

				slideshow.innerHTML = "";
				currentImages.forEach((src, i) => {
					let element;
					if (src.endsWith('.mp4') || src.endsWith('.webm') || src.endsWith('.MOV')) {
						element = document.createElement("video");
						element.src = src;
						element.controls = true;
						element.autoplay = (i === 0);
						element.muted = false;
						element.loop = true;
					} else {
						element = document.createElement("img");
						element.src = src;
					}
					element.alt = `${event.title} Slide ${i + 1}`;
					if (i === 0) element.classList.add("active");
					slideshow.appendChild(element);
				});
				
				// Initialize slide indicator
				document.getElementById("slide-indicator").textContent = `Slide 1 of ${currentImages.length}`;
				
				// Add accessibility to buttons
				const prevBtn = document.querySelector('.prev-btn');
				const nextBtn = document.querySelector('.next-btn');
				if (prevBtn && nextBtn) {
					prevBtn.setAttribute('aria-label', 'Previous slide');
					nextBtn.setAttribute('aria-label', 'Next slide');
				} else {
					console.error('Slideshow buttons not found');
				}
				
				// Position buttons after layout render
				requestAnimationFrame(() => {
					positionSlideshowButtons();
				});
							
				// Add swipe functionality
				let touchStartX = 0;
				let touchEndX = 0;
				const minSwipeDistance = 50;

				slideshow.addEventListener('touchstart', (e) => {
					touchStartX = e.changedTouches[0].screenX;
				});

				slideshow.addEventListener('touchend', (e) => {
					touchEndX = e.changedTouches[0].screenX;
					const swipeDistance = touchEndX - touchStartX;
					if (Math.abs(swipeDistance) >= minSwipeDistance) {
						if (swipeDistance < 0) {
							changeSlide(1); // Swipe left -> next slide
						} else {
							changeSlide(-1); // Swipe right -> previous slide
						}
					}
				});

				modal.classList.add('modal-open');
				document.body.style.overflow = "hidden";
				
				console.log('Modal opened successfully');
            } catch (error) {
                console.error('Error in showModal:', error);
            }
        }

        function closeModal() {
            const modal = document.getElementById("modal");
            modal.classList.remove('modal-open');
            document.body.style.overflow = "auto";
            document.querySelectorAll(".slideshow video").forEach(video => video.pause());
            clearInterval(autoSlideInterval);
            console.log('Modal closed');
        }

        function changeSlide(direction) {
            const slides = document.querySelectorAll(".slideshow img, .slideshow video");
            const currentElement = slides[currentSlide];
            currentElement.classList.remove("active");
            if (currentElement.tagName === "VIDEO") currentElement.pause();

            currentSlide = (currentSlide + direction + currentImages.length) % currentImages.length;
            const nextElement = slides[currentSlide];
            nextElement.classList.add("active");
            if (nextElement.tagName === "VIDEO") nextElement.play();
			
			// Update slide indicator
            document.getElementById("slide-indicator").textContent = `Slide ${currentSlide + 1} of ${currentImages.length}`;
        }

        document.getElementById("modal").addEventListener("click", function(e) {
            if (e.target === this) closeModal();
        });
		
		// Reposition buttons on window resize
        window.addEventListener('resize', positionSlideshowButtons);
		
		
    </script>
</body>
