<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/x-icon" href="images/icon/favicon3.png">
	<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Long+Cang&display=swap" rel="stylesheet">
    <title>罗家的旅行</title>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f4f4;
            margin: 0;
        }
		h1 {
            font-family: "Long Cang", cursive;
            font-weight: 700;
            color: #7E102C;
            font-size: 2.5em;
        }
        h2, h3{
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: #58423F;
        }
        h2#trip-subtitle {
            font-size: 1.5em;
            font-weight: 400;
            margin: 15px 0 20px;
        }
        h3 {
            font-size: 1.2em;
        }
        .trip-selector {
            margin: 20px 0;
			display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .trip-btn {
            padding: 15px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: white;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            min-width: 120px;
        }
        .trip-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3); /* Semi-transparent overlay for text readability */
            z-index: 1;
        }
        .trip-btn span {
            position: relative;
            z-index: 2; /* Text above overlay */
        }
        .trip-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .trip-btn.active {
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.7);
            transform: scale(1.1);
        }
        #france-btn {
            background-image: url('images/icon/france.png'); /* Replace with 'eiffel_tower.jpg' if preferred */
        }
        #philly-btn {
            background-image: url('images/icon/philly.png'); /* Replace with 'belem_tower.jpg' if preferred */
        }
        #europe-btn {
            background-image: url('images/icon/europe.png'); /* Replace with 'philly_skyline.jpg' if preferred */
        }
		@media (max-width: 600px) {
            .trip-btn {
                min-width: 100px;
                padding: 12px 20px;
                font-size: 14px;
            }
			.modal-content h2 {
                margin-bottom: 5px;
            }
            .modal-content .location {
				margin-top: 2px;
                margin-bottom: 8px;
            }
            .modal-content .description {
                margin-top: 2px;
				margin-bottom: 10px;
            }
        }
        .timeline {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            max-width: 1200px;
            margin: auto;
        }
        .timeline::before {
            content: "";
            position: absolute;
            width: 4px;
            background-color: #7E102C;
            top: 0;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 0;
        }
        .year-block {
            margin: -360px 0 20px;
            width: 45%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .year-block:first-child {
            margin-top: 20px;
        }
        .year-block:nth-child(even) {
            align-items: flex-start;
            margin-left: 50%;
        }
        .year-block:nth-child(odd) {
            margin-right: 50%;
        }
        .year-block::before {
            content: "";
            position: absolute;
            height: 2px;
            background-color: #333;
            top: 45px;
            z-index: 1;
        }
        .year-block:nth-child(odd)::before {
            right: 0;
            left: 100%;
        }
        .year-block:nth-child(even)::before {
            left: 0;
            right: 100%;
        }
        .year-title {
			font-family: 'Quintessential', serif;
			font-weight: 400;
			font-style: italic;
            font-size: 24px;
			color: #58423F;
            background: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            position: relative;
            z-index: 2;
            margin-bottom: 10px;
        }
        .event {
            margin: 10px 0;
            padding: 10px;
            max-width: 300px;
            max-height: 400px;
            position: relative;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: left;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .event.show {
            opacity: 1;
            transform: translateY(0);
        }
		.event h3 {
            margin: 0;
            flex-shrink: 0;
        }
        .event img {
            width: 100%;
            height: auto;
            max-width: 280px;
            max-height: 300px;
            margin-top: 10px;
            object-fit: contain;
            flex-shrink: 1;
			cursor: pointer;
        }
        .event p {
            margin: 5px 0 0;
            flex-shrink: 0;
			font-weight: 400;
            color: #58423F;
			font-style: italic;
        }
        .event a {
            text-decoration: none;
			color: #58423F;
            flex-shrink: 0;
            margin-top: 5px;
            cursor: pointer;
			font-weight: bold;
        }
		.event a:hover {
            color: #7E102C;
        }
        #content {
            display: none;
        }
        #access-denied {
            display: none;
            color: #7E102C;
            font-size: 18px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 80vw;
            max-width: 900px;
            height: 80vh;
            max-height: 700px;
            overflow-y: auto;
            position: relative;
            text-align: left;
            display: flex;
            flex-direction: column;
        }
        .modal-content h2 {
            margin: 0 0 10px;
        }
        .modal-content .location {
            font-style: italic;
            color: #E1D4C1;
            margin-bottom: 15px;
            font-weight: 400;
        }
        .modal-content .description {
            margin-bottom: 20px;
            line-height: 1.6;
			font-weight: 400;
            color: #58423F;
        }
        .slideshow {
            position: relative;
            width: 100%;
            height: 50vh;
            max-height: 500px;
            overflow: hidden;
            border-radius: 4px;
            flex-grow: 1;
			touch-action: pan-y;
        }
        .slideshow img,
        .slideshow video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            z-index: 1;
        }
        .slideshow img.active,
        .slideshow video.active {
            opacity: 1;
            z-index: 2;
        }
        .slideshow video {
            background: #000;
        }
        .slideshow-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            font-size: 18px;
            z-index: 3;
            opacity: 0.7;
            transition: opacity 0.3s ease;
			font-family: 'Montserrat', sans-serif;
        }
        .slideshow:hover .slideshow-btn {
            opacity: 1;
        }
        .prev-btn {
            left: 10px;
        }
        .next-btn {
            right: 10px;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            cursor: pointer;
            background: none;
            border: none;
            color: #58423F;
            z-index: 4;
			font-family: 'Montserrat', sans-serif;
        }
		#back-to-top {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            cursor: pointer;
            display: none;
            opacity: 0.7;
            transition: opacity 0.3s ease, transform 0.2s ease;
            z-index: 1000;
			font-family: 'Montserrat', sans-serif;
        }
        #back-to-top:hover {
            opacity: 1;
            transform: scale(1.1);
        }
        #back-to-top.show {
            display: block;
        }
    </style>
</head>
<body>

    <div class="trip-selector">

            <div class="slideshow">
                <!-- Slides populated by JS -->

            <button class="slideshow-btn prev-btn" onclick="changeSlide(-1)">❮</button>
            <button class="slideshow-btn next-btn" onclick="changeSlide(1)">❯</button>
        </div>
    </div>

                    },

                        events: {

                                {

                let yearIndex = 0;
                for (let year in eventsData) {
                    let yearBlock = document.createElement("div");

                    let yearTitle = document.createElement("div");
                    yearTitle.className = "year-title";

                        eventDiv.className = "event";
                        eventDiv.innerHTML = `
                            <h3>${event.title}</h3>
                            <img src="${event.image}" alt="${year} Event" onclick="showModal('${year}', ${index}, '${trip}')">

                        `;

                    });
                    
                    timeline.appendChild(yearBlock);
                    yearIndex++;
                }

                window.tripsData = tripsData;

                function checkVisibility() {
                    document.querySelectorAll(".event").forEach(event => {
                        const rect = event.getBoundingClientRect();
                        if (rect.top < window.innerHeight * 0.8) {
                            event.classList.add("show");
                        }
                    });
                }
                window.addEventListener("scroll", checkVisibility);
                checkVisibility();
            }
			
			// Back to Top Button Logic
            const backToTopButton = document.getElementById("back-to-top");
            window.addEventListener("scroll", () => {
                if (window.scrollY > 100) {
                    backToTopButton.classList.add("show");
                } else {
                    backToTopButton.classList.remove("show");
                }
            });

            backToTopButton.addEventListener("click", () => {
                window.scrollTo({ top: 0, behavior: "smooth" });
            });
        });

        let currentSlide = 0;
        let currentImages = [];
        let currentTrip = 'france';

        function showModal(year, index, trip) {
            const event = window.tripsData[trip].events[year][index];
            const modal = document.getElementById("modal");
            const modalTitle = document.getElementById("modal-title");
            const modalLocation = document.getElementById("modal-location");
            const modalDescription = document.getElementById("modal-description");
            const slideshow = document.querySelector(".slideshow");

            modalTitle.textContent = event.title;
            modalLocation.textContent = `Location: ${event.location}`;
            modalDescription.textContent = event.description;
            currentImages = event.images;
            currentSlide = 0;
            currentTrip = trip;

            slideshow.innerHTML = "";
            currentImages.forEach((src, i) => {
                let element;
                if (src.endsWith('.mp4') || src.endsWith('.webm') || src.endsWith('.MOV')) {
                    element = document.createElement("video");
                    element.src = src;
                    element.controls = true;
                    element.autoplay = (i === 0);
                    element.muted = true;
                    element.loop = true;
                } else {
                    element = document.createElement("img");
                    element.src = src;
                }
                element.alt = `${event.title} Slide ${i + 1}`;
                if (i === 0) element.classList.add("active");
                slideshow.appendChild(element);
            });
			
			// Add swipe functionality
            let touchStartX = 0;
            let touchEndX = 0;
            const minSwipeDistance = 50;

            slideshow.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            });

            slideshow.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                const swipeDistance = touchEndX - touchStartX;
                if (Math.abs(swipeDistance) >= minSwipeDistance) {
                    if (swipeDistance < 0) {
                        changeSlide(1); // Swipe left -> next slide
                    } else {
                        changeSlide(-1); // Swipe right -> previous slide
                    }
                }
            });

            modal.style.display = "flex";
            document.body.style.overflow = "hidden";
        }

        function closeModal() {
            const modal = document.getElementById("modal");
            modal.style.display = "none";
            document.body.style.overflow = "auto";
            document.querySelectorAll(".slideshow video").forEach(video => video.pause());
        }

        function changeSlide(direction) {
            const slides = document.querySelectorAll(".slideshow img, .slideshow video");
            const currentElement = slides[currentSlide];
            currentElement.classList.remove("active");
            if (currentElement.tagName === "VIDEO") currentElement.pause();

            currentSlide = (currentSlide + direction + currentImages.length) % currentImages.length;
            const nextElement = slides[currentSlide];
            nextElement.classList.add("active");
            if (nextElement.tagName === "VIDEO") nextElement.play();
        }

        document.getElementById("modal").addEventListener("click", function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
