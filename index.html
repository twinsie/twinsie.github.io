<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
	<meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/x-icon" href="images/icon/favicon3.png">
	<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Long+Cang&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Long+Cang&family=Noto+Serif+SC:wght@200..900&display=swap" rel="stylesheet">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Quintessential&display=swap" rel="stylesheet">
    <title>罗家的旅行</title>
    <style>
        body {
            font-family: 'Noto Serif SC', serif;
            text-align: center;
            padding: 20px;
            /*background-color: #f4f4f4;*/
			margin: 0;
            background-color: #f2f2f2; /* Solid background when image disappears */
            position: relative;
            opacity: 1; /* Ensure content is fully opaque */
            z-index: 0;
        }
		/* Default background (gradient animation) */
        body.bg-default {
            background: linear-gradient(45deg, #f2f2f2, #cccccc, #f2f2f2, #cccccc, #f2f2f2, #cccccc, #f2f2f2, #cccccc);
            background-size: 400%;
            animation: gradientShift 15s ease infinite;
        }
		/* Background image layer (scrolls with page, transparent) */
        .background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 500px; /* Covers header; adjust if needed */
            background-size: cover;
            background-position: center;
            opacity: 0.6; /* Transparent/muted background image */
            z-index: -2;
            transition: background-image 500ms ease-in-out;
        }
        .background-layer.bg-france {
            background-image: url('images/icon/france-bg.jpg');
        }
        .background-layer.bg-philly {
            background-image: url('images/icon/philly-bg.jpg');
        }
        .background-layer.bg-europe {
            background-image: url('images/icon/europe-bg.jpg');
        }
        /* Fade-out gradient at bottom of background layer */
        .fade-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 500px; /* Matches background-layer */
            background-image: linear-gradient(
                to bottom,
                rgba(242, 242, 242, 0) 0%,
                rgba(242, 242, 242, 0.5) 50%,
                rgba(242, 242, 242, 1) 100%
            );
            z-index: -1;
        }
		h1 {
            font-family: 'Long Cang', cursive;
            font-weight: 700;
            color: #7E102C;
            font-size: 3.5em;
        }
        h2{
            font-family: 'Ma Shan Zheng', serif;
            font-weight: 400;
            color: #58423F;
        }
        h3 {
            font-family: 'Noto Serif SC', serif;
            font-weight: 700;
            color: #58423F;
            font-size: 1.0em;
        }
        h2#trip-subtitle {
            font-size: 1.5em;
            font-weight: 400;
            margin: 15px 0 20px;
        }
		.trip-selector-container {
            position: relative;
            margin: 20px auto;
            max-width: 1200px;
            opacity: 1;
            z-index: 1;
        }
        .trip-selector {
            display: flex;
            flex-wrap: nowrap !important;
            overflow-x: auto !important;
            scroll-behavior: smooth;
            padding: 0 35px;
            -webkit-overflow-scrolling: touch;
            white-space: nowrap;
            justify-content: center;
            gap: 10px;
            width: auto;
            opacity: 1;
            position: relative;
            z-index: 1;
            -ms-overflow-style: none;
            scrollbar-width: none;
            box-sizing: content-box;
        }
		/* Styles for the fading effect */
        .trip-selector::-webkit-scrollbar {
            display: none;
        }
        .fade-left, .fade-right {
            position: absolute;
            top: 0;
            width: 85px;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: none;
        }
        .fade-left.visible, .fade-right.visible {
            display: block;
        }
        .fade-left {
            left: 0;
        }
        .fade-right {
            right: 0;
        }
        .scroll-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(94, 62, 59, 0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            cursor: pointer;
            font-size: 18px;
            z-index: 3;
            opacity: 0.7;
            transition: opacity 0.3s ease, transform 0.2s ease;
            display: none;
            font-family: 'Montserrat', sans-serif;
        }
        .scroll-btn:hover {
            opacity: 1;
            transform: translateY(-50%) scale(1.1);
        }
        .scroll-btn:focus {
            outline: 2px solid #7E102C;
            outline-offset: 2px;
        }
        .scroll-btn.visible {
            display: block;
        }
        .scroll-btn.left-btn {
            left: 0;
        }
        .scroll-btn.right-btn {
            right: 0;
        }
        @media (max-width: 600px) {
            .background-layer,
            .fade-layer {
                height: 250px;
            }
            .trip-selector {
                padding: 0 25px;
            }
            .fade-left, .fade-right {
                width: 25px;
            }
            .scroll-btn {
                width: 25px;
                height: 25px;
                font-size: 14px;
            }
        }
        .trip-btn {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: white;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            min-width: 90px;
            flex-shrink: 0;
            opacity: 0;            
            animation: fadeIn 0.5s ease-out forwards;
        }
        #france-btn { background-image: url('images/icon/france.png'); animation-delay: 0.2s; }
        #philly-btn { background-image: url('images/icon/philly.png'); animation-delay: 0.4s; }
        #europe-btn { background-image: url('images/icon/europe.png'); animation-delay: 0.6s; }
        #italy-btn { background-image: url('images/icon/italy.png'); animation-delay: 0.8s; }
        #japan-btn { background-image: url('images/icon/japan.png'); animation-delay: 1.0s; }
        #australia-btn { background-image: url('images/icon/australia.png'); animation-delay: 1.2s; }
        #canada-btn { background-image: url('images/icon/canada.png'); animation-delay: 1.4s; }
        #brazil-btn { background-image: url('images/icon/brazil.png'); animation-delay: 1.6s; }
        #iceland-btn { background-image: url('images/icon/iceland.png'); animation-delay: 1.8s; }
        #thailand-btn { background-image: url('images/icon/thailand.png'); animation-delay: 2.0s; }
        
        
        .trip-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3); /* Semi-transparent overlay for text readability */
            z-index: 1;
        }
        .trip-btn span {
            position: relative;
            z-index: 2; /* Text above overlay */
        }
        .trip-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .trip-btn.active {
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.7);
            transform: scale(1.1);
        }
		@media (max-width: 600px) {
            .trip-btn {
                min-width: 100px;
                padding: 12px 20px;
                font-size: 14px;
            }
			.modal-content h2 {
                margin-bottom: 5px;
            }
            .modal-content .location {
				margin-top: 2px;
                margin-bottom: 8px;
            }
            .modal-content .description {
                margin-top: 2px;
				margin-bottom: 10px;
            }
			.slide-indicator {
                font-size: 12px;
                margin-top: 8px;
            }
			.background-layer,
            .fade-layer {
                height: 400px; /* Adjust for smaller screens */
            }
        }
        .timeline {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            max-width: 1200px;
            margin: auto;
        }
        .timeline::before {
            content: "";
            position: absolute;
            width: 4px;
            background-color: #7E102C;
            top: 0;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 0;
        }
        .year-block {
            margin: -360px 0 20px;
            width: 45%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .year-block:first-child {
            margin-top: 20px;
        }
        .year-block:nth-child(even) {
            align-items: flex-start;
            margin-left: 50%;
        }
        .year-block:nth-child(odd) {
            margin-right: 50%;
        }
        .year-block::before {
            content: "";
            position: absolute;
            height: 2px;
            background-color: #333;
            top: 45px;
            z-index: 1;
        }
        .year-block:nth-child(odd)::before {
            right: 0;
            left: 100%;
        }
        .year-block:nth-child(even)::before {
            left: 0;
            right: 100%;
        }
        .year-title {
			font-family: 'Quintessential', serif;
			font-weight: 400;
			font-style: italic;
            font-size: 20px;
			color: #58423F;
            background: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            position: sticky; /*relative*/
			top: 20px; /* Adjust based on your header height */
			z-index: 3; /* Ensure it stays above other elements */
            margin-bottom: 10px;
			box-shadow: 0 0 8px rgba(179, 179, 179, 0.7); /* Glow effect matching timeline color */
        }
		.the-end {
            font-family: 'Quintessential', serif;
            font-weight: 400;
            font-style: italic;
            font-size: 24px;
            color: #58423F;
            background: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            position: relative;
            z-index: 2;
            margin: 20px auto;
            text-align: center;
        }
        .event {
            margin: 10px 0;
            padding: 10px;
            max-width: 400px;
            max-height: 500px;
            position: relative;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: left;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .event.show {
            opacity: 1;
            transform: translateY(0);
        }
		.event h3 {
            margin: 0;
            flex-shrink: 0;
        }
        .event img {
            width: 100%;
            height: auto;
            max-width: 380px;
            max-height: 400px;
            margin-top: 10px;
            object-fit: contain;
            flex-shrink: 1;
			cursor: pointer;
        }
        .event p {
            margin: 5px 0 0;
            flex-shrink: 0;
			font-weight: 400;
            color: #58423F;
			font-style: italic;
			font-size: 0.8em;
        }
        .event a {
            text-decoration: none;
			color: #58423F;
            flex-shrink: 0;
            margin-top: 5px;
            cursor: pointer;
			font-weight: bold;
        }
		.event a:hover {
            color: #7E102C;
        }
        #content {
            display: none;
        }
        #access-denied {
            display: none;
            color: #7E102C;
            font-size: 18px;
        }
        .modal {
			display: flex;
            visibility: hidden;
			opacity: 0;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
			transition: opacity 300ms ease-in-out, visibility 300ms ease-in-out;
		/*	backdrop-filter: blur(5px);
			-webkit-backdrop-filter: blur(5px); */
        }
		.modal.modal-open {
			visibility: visible;
			opacity: 1;
		}
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 80vw;
            max-width: 900px;
            height: 80vh;
            max-height: 700px;
            overflow-y: auto;
            position: relative;
            text-align: left;
            display: flex;
            flex-direction: column;
			opacity: 0;
			transform: scale(0.95);
			transition: opacity 300ms ease-in-out, transform 300ms ease-in-out;
        }
		.modal.modal-open .modal-content {
			opacity: 1;
			transform: scale(1);
		}
        .modal-content h2 {
            margin: 0 0 10px;
        }
        .modal-content .location {
            font-style: italic;
            color: #E1D4C1;
            margin-bottom: 15px;
            font-weight: 400;
        }
        .modal-content .description {
            margin-bottom: 20px;
            line-height: 1.6;
			font-weight: 400;
            color: #58423F;
        }
        .slideshow {
            position: relative;
            width: 100%;
            height: 50vh;
            max-height: 500px;
            overflow: hidden;
            border-radius: 4px;
            flex-grow: 1;
			touch-action: pan-y;
        }
        .slideshow img,
        .slideshow video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            z-index: 1;
        }
        .slideshow img.active,
        .slideshow video.active {
            opacity: 1;
            z-index: 2;
        }
        .slideshow video {
            background: #000;
        }
        .slideshow-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            font-size: 18px;
            z-index: 3;
            opacity: 0.7;
            transition: opacity 0.3s ease;
			font-family: 'Montserrat', sans-serif;
        }
        .slideshow:hover .slideshow-btn {
            opacity: 1;
        }
        .prev-btn {
            left: 10px;
        }
        .next-btn {
            right: 10px;
        }		
		.slideshow-btn:focus {
			outline: 2px solid #7E102C;
			outline-offset: 2px;
		}
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            cursor: pointer;
            background: none;
            border: none;
            color: #58423F;
            z-index: 4;
			font-family: 'Montserrat', sans-serif;
        }
		.slide-indicator {
			font-family: 'Montserrat', sans-serif;
			font-size: 14px;
			color: #58423F;
			text-align: center;
			margin-top: 10px;
			margin-bottom: 0;
		}
		#back-to-top {
            position: fixed;
            bottom: 20px;
            right: 20px;
         /*   background-color: #333; */
            color: white;
            border: none;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            cursor: pointer;
            display: none;
            opacity: 0.7;
            transition: opacity 0.3s ease, transform 0.2s ease;
            z-index: 1000;
			font-family: 'Montserrat', sans-serif;
        }
		#back-to-top img {
			width: 100%;
			height: 100%;
			object-fit: contain;
		}
        #back-to-top:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        #back-to-top.show {
            display: block;
        }
		.typing-cursor {
            display: inline-block;
            font-family: 'Playfair Display', serif;
            font-size: 1.5em;
            color: #58423F;
            animation: blink 0.7s step-end infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
		@keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
	<div class="background-layer bg-france"></div>
    <div class="fade-layer"></div>
    <h1>罗家的旅行</h1>
    <div class="trip-selector-container">
        <div class="fade-left"></div>
        <button class="scroll-btn left-btn" aria-label="Scroll left">←</button>
        <div class="trip-selector">
            <button id="france-btn" class="trip-btn active" data-trip="france"><span>新西兰</span></button>
            <button id="philly-btn" class="trip-btn" data-trip="philly"><span>Philadelphia</span></button>
            <button id="europe-btn" class="trip-btn" data-trip="europe"><span>Europe</span></button>
            <button id="italy-btn" class="trip-btn" data-trip="italy"><span>Italy</span></button>
            <button id="japan-btn" class="trip-btn" data-trip="japan"><span>Japan</span></button>
            <button id="australia-btn" class="trip-btn" data-trip="australia"><span>Australia</span></button>
            <button id="canada-btn" class="trip-btn" data-trip="canada"><span>Canada</span></button>
            <button id="brazil-btn" class="trip-btn" data-trip="brazil"><span>Brazil</span></button>
            <button id="iceland-btn" class="trip-btn" data-trip="iceland"><span>Iceland</span></button>
            <button id="thailand-btn" class="trip-btn" data-trip="thailand"><span>Thailand</span></button>
        </div>
        <button class="scroll-btn right-btn" aria-label="Scroll right">→</button>
        <div class="fade-right"></div>        
    </div>
	<h2 id="trip-subtitle">新西兰南北岛</h2>
    <div id="content">
        <div class="timeline">
            <!-- Timeline content populated by JS -->
        </div>
    </div>
    <div id="access-denied">Access Denied: Incorrect Password</div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">×</button>
            <h2 id="modal-title"></h2>
            <p id="modal-location" class="location"></p>
            <p id="modal-description" class="description"></p>
            <div class="slideshow">
                <!-- Slides populated by JS -->

            </div>
			<p id="slide-indicator" class="slide-indicator"></p>
            <button class="slideshow-btn prev-btn" onclick="changeSlide(-1)"><</button>
			<button class="slideshow-btn next-btn" onclick="changeSlide(1)">></button>
        </div>
    </div>

	<button id="back-to-top" title="Back to Top">
		<img src="images/icon/back-to-top.png" alt="Back to Top">
	</button>
	
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const enablePassword = false;
            const correctPassword = "123";
            const contentDiv = document.getElementById("content");
            const accessDeniedDiv = document.getElementById("access-denied");
			const backgroundLayer = document.querySelector('.background-layer');
			const tripSelector = document.querySelector('.trip-selector');
            const leftBtn = document.querySelector('.scroll-btn.left-btn');
            const rightBtn = document.querySelector('.scroll-btn.right-btn');
            
            // Scroll arrow and fade functionality
            function updateScrollButtons() {
                const isAtStart = tripSelector.scrollLeft <= 1;
                const isAtEnd = tripSelector.scrollLeft + tripSelector.clientWidth >= tripSelector.scrollWidth - 1;
                const isScrollable = tripSelector.scrollWidth > tripSelector.clientWidth + 2;
                leftBtn.classList.toggle('visible', !isAtStart && isScrollable);
                rightBtn.classList.toggle('visible', !isAtEnd && isScrollable);
                document.querySelector('.fade-left').classList.toggle('visible', !isAtStart && isScrollable);
                document.querySelector('.fade-right').classList.toggle('visible', !isAtEnd && isScrollable);
                tripSelector.style.justifyContent = isScrollable ? 'flex-start' : 'center';
                console.log('isScrollable:', isScrollable, 'scrollWidth:', tripSelector.scrollWidth, 'clientWidth:', tripSelector.clientWidth);
                console.log('Arrow visibility:', leftBtn.classList.contains('visible'), rightBtn.classList.contains('visible'));
                console.log('Fade visibility:', document.querySelector('.fade-left').classList.contains('visible'), document.querySelector('.fade-right').classList.contains('visible'));
                console.log('Justify-content:', tripSelector.style.justifyContent || getComputedStyle(tripSelector).justifyContent);
            }
            
            leftBtn.addEventListener('click', () => {
                tripSelector.scrollBy({ left: -200, behavior: 'smooth' });
                setTimeout(updateScrollButtons, 300);
            });

            rightBtn.addEventListener('click', () => {
                tripSelector.scrollBy({ left: 200, behavior: 'smooth' });
                setTimeout(updateScrollButtons, 300);
            });
            
            tripSelector.addEventListener('scroll', updateScrollButtons);
            window.addEventListener('resize', updateScrollButtons);
            setTimeout(updateScrollButtons, 100); // Initial check after load

            // Keyboard support for arrows
            tripSelector.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    tripSelector.scrollBy({ left: -200, behavior: 'smooth' });
                    setTimeout(updateScrollButtons, 300);
                } else if (e.key === 'ArrowRight') {
                    tripSelector.scrollBy({ left: 200, behavior: 'smooth' });
                    setTimeout(updateScrollButtons, 300);
                }
            });
            
			function typewriterEffect(element, text, speed = 80) {
                element.innerHTML = '';
                let i = 0;
                const type = () => {
                    if (i < text.length) {
                        element.innerHTML = text.slice(0, i + 1) + '<span class="typing-cursor">_</span>';
                        i++;
                        setTimeout(type, speed);
                    } else {
                        element.innerHTML = text + '<span class="typing-cursor">_</span>';
                    }
                };
                type();
            }
			
			const tripsData = {
                    france: {
                        subtitle: "新西兰南北岛, Aug. 2024",
						backgroundImage: "bg-france",
                        events: {
                            "出发日": [
                                { 
                                    title: "各自飞", 
                                    image: "images/france-0-1-5.HEIC", 
                                    location: "Auckland Airport", 
                                    description: "我们前往了新西兰，各自从不同的地方出发，在奥克兰汇合。",
                                    images: ["images/france-0-1-1.HEIC", "images/france-0-1-2.HEIC", "images/france-0-1-3.HEIC", "images/france-0-1-4.HEIC", "images/france-0-1-5.HEIC", "images/france-0-1-6.HEIC"]
                                },
                                { 
                                    title: "In the Air", 
                                    image: "images/france-0-2-2.jpg",

        function showModal(year, index, trip) {
            console.log('showModal called:', { year, index, trip });
            try {
			
				const event = window.tripsData[trip].events[year][index];
				const modal = document.getElementById("modal");
				const modalTitle = document.getElementById("modal-title");
				const modalLocation = document.getElementById("modal-location");
				const modalDescription = document.getElementById("modal-description");
				const slideshow = document.querySelector(".slideshow");

				modalTitle.textContent = event.title;
				modalLocation.textContent = `Location: ${event.location}`;
				modalDescription.innerHTML = event.description;
				currentImages = event.images;
				currentSlide = 0;
				currentTrip = trip;

				slideshow.innerHTML = "";
				currentImages.forEach((src, i) => {
					let element;
					if (src.endsWith('.mp4') || src.endsWith('.webm') || src.endsWith('.MOV')) {
						element = document.createElement("video");
						element.src = src;
						element.controls = true;
						element.autoplay = (i === 0);
						element.muted = false;
						element.loop = true;
					} else {
						element = document.createElement("img");
						element.src = src;
					}
					element.alt = `${event.title} Slide ${i + 1}`;
					if (i === 0) element.classList.add("active");
					slideshow.appendChild(element);
				});
				
				// Initialize slide indicator
				document.getElementById("slide-indicator").textContent = `Slide 1 of ${currentImages.length}`;
				
				// Add accessibility to buttons
				const prevBtn = document.querySelector('.prev-btn');
				const nextBtn = document.querySelector('.next-btn');
				if (prevBtn && nextBtn) {
					prevBtn.setAttribute('aria-label', 'Previous slide');
					nextBtn.setAttribute('aria-label', 'Next slide');
				} else {
					console.error('Slideshow buttons not found');
				}
				
				// Position buttons after layout render
				requestAnimationFrame(() => {
					positionSlideshowButtons();
				});
							
				// Add swipe functionality
				let touchStartX = 0;
				let touchEndX = 0;
				const minSwipeDistance = 50;

				slideshow.addEventListener('touchstart', (e) => {
					touchStartX = e.changedTouches[0].screenX;
				});

				slideshow.addEventListener('touchend', (e) => {
					touchEndX = e.changedTouches[0].screenX;
					const swipeDistance = touchEndX - touchStartX;
					if (Math.abs(swipeDistance) >= minSwipeDistance) {
						if (swipeDistance < 0) {
							changeSlide(1); // Swipe left -> next slide
						} else {
							changeSlide(-1); // Swipe right -> previous slide
						}
					}
				});

				modal.classList.add('modal-open');
				document.body.style.overflow = "hidden";
				
				console.log('Modal opened successfully');
            } catch (error) {
                console.error('Error in showModal:', error);
            }
        }

            currentElement.classList.remove("active");
            if (currentElement.tagName === "VIDEO") currentElement.pause();

            currentSlide = (currentSlide + direction + currentImages.length) % currentImages.length;
            const nextElement = slides[currentSlide];
            nextElement.classList.add("active");
            if (nextElement.tagName === "VIDEO") nextElement.play();
			
			// Update slide indicator
            document.getElementById("slide-indicator").textContent = `Slide ${currentSlide + 1} of ${currentImages.length}`;
        }

        document.getElementById("modal").addEventListener("click", function(e) {
            if (e.target === this) closeModal();
        });
		
		// Reposition buttons on window resize
        window.addEventListener('resize', positionSlideshowButtons);
		
		
    </script>
</body>
</html>
